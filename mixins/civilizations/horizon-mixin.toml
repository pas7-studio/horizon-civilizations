[mod]
id = "civilizations"
version = "0.1.14"
priority = 100

# Pin an inspected upstream revision. The native mod MUST be rebuilt and
# integration-tested before moving this revision forward.
[compatibility]
horizon_revision = "18840db9146b2521dd46ad52a4559a49be180f8f"

[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "civilizations_core"
source = "core.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "civilizations_glue"
source = "glue.rs"

[[injection]]
id = "register"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::ServerTickPhase", value = "phase" },
]

[[injection]]
id = "lifecycle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_lifecycle"
helper = "lifecycle.rs"
bindings = [
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

[[injection]]
id = "level_tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "interact_entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_interact_entity"
helper = "interact_entity.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "i32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# Native API 233: cancel unpriced access to a settlement's public barrels.
# This does NOT claim unrelated vanilla or player-owned containers.
[[injection]]
id = "warehouse_inventory"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_inventory_block_start"
helper = "warehouse_block_start.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

# Native API 334: prevent external hopper/automation pipelines from moving
# items into/out of a settlement's two registered public barrel inventories.
[[injection]]
id = "hopper_transfer"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_inventory_move_item"
helper = "hopper_transfer.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "source", ty = "[i32; 3]", value = "source" },
  { name = "destination", ty = "[i32; 3]", value = "destination" },
  { name = "item", ty = "&str", value = "item" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

# Native API 14: registered civic buildings and private parcels respect
# actual native player block-breaking permission, not only NPC build rules.
[[injection]]
id = "protect_break"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_destroy_block"
helper = "protect_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "cancel", ty = "&mut bool", value = "&mut *canceled" },
]

# Village boards are records, not notes: right-click never opens their editor
# and any submitted sign text for them is refused. Other signs are untouched.
[[injection]]
id = "sign_click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "sign_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "sign_edit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_sign_changed"
helper = "sign_edit.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

# Villager conversation menus: clicks on their buttons, the trade page's input
# slots when it closes, and cleanup when any such menu closes.
[[injection]]
id = "menu_click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_menu_clicked"
helper = "menu_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
  { name = "slot", ty = "i32", value = "slot" },
]

[[injection]]
id = "menu_input"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_menu_input_closed"
helper = "menu_input.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
  { name = "slots", ty = "&mut Vec<Option<horizon_client::items::ItemStack>>", value = "&mut *slots" },
]

[[injection]]
id = "menu_close"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_menu_closed"
helper = "menu_close.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
]
