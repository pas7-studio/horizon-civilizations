name: Horizon native compile gate
on:
  push:
    branches: [main]
    paths:
      - 'mixins/**'
      - 'tools/native_build.py'
      - 'compatibility.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Compile against pinned Horizon and run native tests
        run: python3 tools/native_build.py --test
      - name: Upload mixin diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civilizations-native-plan
          path: target/native-check/plan.json
          if-no-files-found: ignore
