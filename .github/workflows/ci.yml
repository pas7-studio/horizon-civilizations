name: Civilizations native mod
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 tools/package.py
      - run: python3 tools/verify_static.py
      - uses: actions/upload-artifact@v4
        with:
          name: civilizations-hnmod-source
          path: target/*.hnmod
