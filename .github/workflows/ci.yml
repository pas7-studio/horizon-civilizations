name: Civilizations native mod
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Format Rust and record changes
        run: |
          cargo fmt --all
          rustfmt --edition 2024 mixins/civilizations/*.rs
          git diff --binary > rustfmt.patch
          cargo fmt --all --check
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: warn
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 tools/package.py
      - run: python3 tools/verify_static.py
      - uses: actions/upload-artifact@v4
        with:
          name: civilizations-hnmod-source
          path: target/*.hnmod
